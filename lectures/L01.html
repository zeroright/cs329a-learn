  <details class="section" id="selfCheck"><summary>自测与闪卡（自编）</summary><div class="body"><section><h3>自测问答</h3><div id="quizRoot"></div></section><section><h3>概念闪卡</h3><div id="flashRoot"></div></section></div></details>

<script src="../data/lectures/L01.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const id="L01";
  const host=document.getElementById('lectureBody');
  renderMarkdown(LECTURE_MD[id], host);
  // Split top-level H2 into collapsible sections
  (function split(){
    const kids=[...host.children];
    if(!kids.length) return;
    const frag=document.createDocumentFragment();
    let cur=null, body=null;
    function start(title, open){
      cur=document.createElement('details'); cur.className='section'; if(open) cur.open=true;
      const sum=document.createElement('summary'); sum.textContent=title; cur.appendChild(sum);
      body=document.createElement('div'); body.className='body content'; cur.appendChild(body);
      frag.appendChild(cur);
    }
    start('导言与目标', true);
    kids.forEach(el=>{
      if(el.tagName==='H2'){
        const title=el.textContent.trim();
        const open=/课堂脉络|论文精读|作业与实战|本课定位|学习目标|学习路径|（/.test(title);
        start(title, open || /作业/.test(title));
        if(el.id) cur.id=el.id;
      } else {
        body.appendChild(el);
      }
    });
    host.innerHTML=''; host.appendChild(frag);
    // re-run mermaid/katex inside new containers
    if(window.mermaid){try{mermaid.run({querySelector:'.mermaid'});}catch(e){}}
    if(window.renderMathInElement){
      host.querySelectorAll('.content').forEach(el=>renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}));
    }
  })();

  if(window.CS329A_VIZ){try{CS329A_VIZ.inject(id, host);}catch(e){console.warn('viz inject',e);}}

  // re-render mermaid/katex when a section is expanded
  host.querySelectorAll('details.section').forEach(d=>{
    d.addEventListener('toggle',()=>{
      if(!d.open) return;
      if(window.mermaid){try{mermaid.run({nodes:d.querySelectorAll('.mermaid')});}catch(e){}}
      if(window.renderMathInElement){
        d.querySelectorAll('.content').forEach(el=>renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}));
      }
    });
  });

  if(window.CS329A_bindSlideLightbox) CS329A_bindSlideLightbox();
  mountQuiz(document.getElementById('quizRoot'), id, (QUIZZES||{})[id]);
  mountFlashcards(document.getElementById('flashRoot'), id, (FLASHCARDS||{})[id]||[]);
  document.getElementById('markDone').onclick=()=>{
    CS329A.markLectureDone(id);
    document.getElementById('doneBar').style.width='100%';
    alert('已标记完成（localStorage）');
  };
  const p=CS329A.loadProgress();
  if(p.lectures && p.lectures[id] && p.lectures[id].done) document.getElementById('doneBar').style.width='100%';
});
</script>
