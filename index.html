<html lang="zh-CN">
<head>
<meta charset="utf-8"/>

<title>首页 · CS329A 自学站</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"/>
<link rel="stylesheet" href="css/site.css"/>
<script src="vendor/marked.min.js"></script>
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/auto-render.min.js"></script>
<script defer src="vendor/mermaid.min.js"></script>
<script src="js/site-shell.js"></script>
<script src="js/app.js"></script>
<script src="js/render.md.js"></script>
<script src="js/quiz.js"></script>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  if(window.mermaid) mermaid.initialize({startOnLoad:false, theme: document.documentElement.getAttribute('data-theme')==='dark'?'dark':'default'});
});
</script>
<link rel="stylesheet" href="css/learning.css"/>
<script src="data/learning.js"></script>
<script defer src="js/learning.js"></script>
</head>
<body>
<a class="skip-link" href="#mainContent">跳到主要内容</a>
<header class="topbar"></header>

<div class="layout">

<main class="main" id="mainContent">
<section class="hero home-hero"><span class="eyebrow">STANFORD CS329A / AUTUMN 2025</span><h1>自我改进型 AI Agent 学习工作台</h1><p>先选路线，再读章节、做实验、验证结果。课程目录与资料在下方集中查看。</p></section>
<section id="learningHome" class="learning-home" aria-label="继续学习"></section>
<section id="videos" class="course-catalog" aria-labelledby="catalogTitle"><div class="section-heading"><div><span class="eyebrow">COURSE CATALOG</span><h2 id="catalogTitle">全部讲次与资料</h2></div><p class="muted">9 讲视频 · 8 讲论文补读 · 3 次展示</p></div><div class="table-scroll"><table class="table" id="videoTable"></table></div></section>
<details class="section" id="course-reference"><summary>课程背景与内容来源</summary><div class="body"><section id="staff"><div class="grid" id="staffGrid"></div></section><p>有录像的讲次保留课堂截图与时间戳；缺口讲次以论文及公开材料补读。学习路线、交互实验与综合练习均为本站自编。</p><a href="https://app.notion.com/p/40a9384c52318196b7eeffcbe5cd9d6c" target="_blank" rel="noopener">查看 Notion 原教案</a></div></details>
<details class="section" id="knowledge-map"><summary>知识依赖地图</summary><div class="body"><p class="muted">按课程依赖查看讲次关系；推荐学习顺序见学习路径。</p><svg class="graph" id="kg" role="img" aria-label="课程知识依赖地图"></svg></div></details>
</main>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 document.getElementById('videoTable').innerHTML='<thead><tr><th scope="col">讲次 / 主题</th><th scope="col">内容来源</th><th scope="col">原始资料</th></tr></thead><tbody>'+SITE_META.order.map(id=>{const m=SITE_META.lectures[id];const links=[];if(m.youtube)links.push(`<a href="${m.youtube}" target="_blank" rel="noopener">YouTube</a>`);if(m.bilibili)links.push(`<a href="${m.bilibili}" target="_blank" rel="noopener">B站</a>`);if(m.notion)links.push(`<a href="${m.notion}" target="_blank" rel="noopener">Notion</a>`);return `<tr><td><a href="lectures/${id}.html"><b>${id}</b> · ${m.title}</a><small class="catalog-topics">${LEARNING.lessons[id][0]}</small></td><td>${LEARNING.source(id)}</td><td><div class="catalog-links">${links.join('')||'项目展示练习'}</div></td></tr>`;}).join('')+'</tbody>';
 const staff=SITE_META.staff;if(staff)document.getElementById('staffGrid').innerHTML=`<div><h3>课程讲师</h3><p>${staff.instructors.join('、')}</p><p class="muted">${staff.term} · ${staff.when}</p><a href="${SITE_META.official_site}" target="_blank" rel="noopener">官方课程站</a></div><div><h3>嘉宾专题</h3><p>${staff.guests.map(g=>g.name).join('、')}</p><p class="muted">作业权重与项目要求统一收录在实践中心。</p></div>`;
 const map=document.getElementById('knowledge-map');let drawn=false;map.addEventListener('toggle',()=>{if(!map.open||drawn)return;drawn=true;const dash=new Set(['L03|L06','L02|L13']);drawKnowledgeGraph(document.getElementById('kg'),SITE_META.order.map(id=>({id,...SITE_META.lectures[id]})),SITE_META.edges.map(([a,b])=>[a,b,dash.has(a+'|'+b)?'dash':'solid']),'lectures/');});
});
</script>


</body></html>
