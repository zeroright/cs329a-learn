<main class="container" style="max-width:1100px;margin:1.5rem auto;padding:0 1rem">
<h1>交互可视化</h1>
<p>下列演示对应 L02（pass@k / 测试时算力）、L03（Best-of-N + verifier）、L05（搜索树 / 迷你 MCTS）、L04（ReAct 环）。参数可调；结果仅用于直觉，不代表课程官方数字。</p>

<section>
<h2>1. pass@k 与覆盖率幂律（L02）</h2>
<div class="viz-panel">
  <div class="viz-controls">
    <label>单次成功率 p <input id="pPass" type="range" min="0.01" max="0.5" step="0.01" value="0.1"/><span id="pPassV">0.10</span></label>
    <label>最大 k <input id="kMax" type="range" min="1" max="256" step="1" value="64"/><span id="kMaxV">64</span></label>
    <label>幂律 α（覆盖率 ~ c·N^(-α) 示意） <input id="alpha" type="range" min="0.1" max="1.5" step="0.05" value="0.5"/><span id="alphaV">0.50</span></label>
  </div>
  <div class="viz-canvas"><canvas id="cPass" width="640" height="320"></canvas>
  <p id="passNote" style="font-size:.85rem;opacity:.8"></p></div>
</div>
</section>

<section>
<h2>2. Best-of-N + Verifier（L03）</h2>
<div class="viz-panel">
  <div class="viz-controls">
    <label>候选数 N <input id="bonN" type="range" min="1" max="64" step="1" value="16"/><span id="bonNV">16</span></label>
    <label>真正确率 base <input id="bonBase" type="range" min="0.05" max="0.6" step="0.01" value="0.2"/><span id="bonBaseV">0.20</span></label>
    <label>Verifier 精度 <input id="bonV" type="range" min="0.5" max="1" step="0.01" value="0.8"/><span id="bonVV">0.80</span></label>
  </div>
  <div class="viz-canvas"><canvas id="cBon" width="640" height="320"></canvas></div>
</div>
</section>

<section>
<h2>3. 迷你搜索树 / MCTS 步进展示（L05）</h2>
<div class="viz-panel">
  <div class="viz-controls">
    <label>宽度 branching <input id="mctsB" type="range" min="2" max="5" step="1" value="3"/><span id="mctsBV">3</span></label>
    <label>深度 depth <input id="mctsD" type="range" min="1" max="4" step="1" value="2"/><span id="mctsDV">2</span></label>
    <label>模拟步数 <input id="mctsS" type="range" min="1" max="40" step="1" value="8"/><span id="mctsSV">8</span></label>
    <button id="mctsStep">步进 +1</button>
    <button id="mctsReset">重置</button>
  </div>
  <div class="viz-canvas"><svg id="mctsSvg" width="640" height="360"></svg>
  <p id="mctsNote" style="font-size:.85rem"></p></div>
</div>
</section>

<section>
<h2>4. ReAct 环逐步（L04）</h2>
<div class="viz-panel">
  <div class="viz-controls">
    <button id="reactNext">下一步</button>
    <button id="reactReset">重置</button>
    <p id="reactState" style="font-size:.9rem"></p>
  </div>
  <div class="viz-canvas">
    <ol id="reactLog" style="font-family:ui-monospace,monospace;font-size:.85rem"></ol>
  </div>
</div>
</section>
</main>
<script src="js/viz.js"></script>
</body></html>
