<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>源码对比 · CS329A</title><link rel="stylesheet" href="css/site.css"/><script src="js/site-shell.js"></script>
<script src="js/app.js"></script><link rel="stylesheet" href="css/learning.css"/>
<script src="data/meta.js"></script>
<script src="data/learning.js"></script>
<script defer src="js/learning.js"></script>
</head>
<body>
<a class="skip-link" href="#mainContent">跳到主要内容</a>
<header class="topbar"></header>
<main class="main" id="mainContent"><section class="hero"><span class="eyebrow">实践中心 / 源码对照</span><h1>把任务要求与示例实现放在一起</h1><p>选择一个自编示例，查看它对应的官方任务。示例代码与代码运行页使用同一份数据。</p></section><div class="example-picker"><label for="sourceExample">选择示例</label><select id="sourceExample"></select></div><div class="code-cmp source-workspace"><section class="source-reference"><h2>官方任务参照</h2><div id="sourceReference"></div></section><section><div class="section-heading"><h2>自编实现</h2><a id="runSource" class="btn" href="playground.html">运行此示例 →</a></div><pre class="codebox" id="sourceCode"></pre></section></div></main>
<script src="data/codes.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{
 const select=document.getElementById('sourceExample');(SITE_META.examples||Object.keys(EXAMPLE_CODES).map(file=>({file,title:file}))).forEach(ex=>{const option=document.createElement('option');option.value=ex.file;option.textContent=ex.title;select.appendChild(option);});
 const requested=new URLSearchParams(location.search).get('ex');if([...select.options].some(o=>o.value===requested))select.value=requested;
 function update(){const file=select.value;document.getElementById('sourceCode').textContent=EXAMPLE_CODES[file]||'';document.getElementById('runSource').href='playground.html?ex='+encodeURIComponent(file);const taskMap={'pass_at_k.py':'hw2','majority_best_of_n.py':'hw1','react_loop.py':'hw3'};const hw=taskMap[file];const source=SITE_META.official.find(h=>h.id===hw);document.getElementById('sourceReference').innerHTML=source?`<h3>${source.title}</h3><p>${source.topics}</p><p>右侧为本站自编机制示例，不等于官方答案或完整作业实现。</p><a href="${source.url}" target="_blank" rel="noopener">查看官方仓库 →</a><p><a href="homework.html#${hw}">环境、步骤与复现要求 →</a></p>`:'<h3>课程延伸练习</h3><p>此示例没有独立对应的官方作业题。用于理解算法或工作流，不代表官方答案。</p><a href="assignments.html">查看自编综合项目与验收要求 →</a>';}

 select.onchange=()=>{const u=new URL(location.href);u.searchParams.set('ex',select.value);history.replaceState(null,'',u);update();};update();
});
</script></body></html>
